<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>砚火 · 本地小说工坊</title>
  <link rel="stylesheet" href="/assets/style.css?v=0.20.0">
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark">砚</span><div><b>砚火</b><small>本地小说工坊</small></div></div>
    <div class="header-actions">
      <span id="saveState" class="muted">尚未保存</span>
      <button class="ghost hidden" id="directorStatusBtn">自动导演</button>
      <button class="ghost" id="healthBtn">项目体检</button>
      <button class="ghost" id="previewBtn">提示词预览</button>
      <button class="ghost" id="exportBtn">导出</button>
      <button class="ghost" id="settingsBtn">模型设置</button>
      <button id="saveBtn">保存</button>
    </div>
  </header>

  <main>
    <aside class="left-panel">
      <div class="panel-title"><span>作品</span><div class="project-actions">
        <button class="icon" id="renameProjectBtn" type="button" aria-label="重命名作品" title="重命名作品">✎</button>
        <button class="icon danger-icon" id="deleteProjectBtn" type="button" aria-label="删除作品" title="删除作品">⌫</button>
        <button class="icon" id="newProjectBtn" type="button" aria-label="新建作品" title="新建作品">＋</button>
      </div></div>
      <select id="projectSelect"></select>
      <div class="meta-fields">
        <label>书名<input id="titleInput" placeholder="给故事一个名字"></label>
        <label>类型<input id="genreInput" placeholder="幻想、悬疑、科幻……"></label>
      </div>
      <nav class="tabs">
        <button class="active" data-tab="chapters">章节</button>
        <button data-tab="story">故事圣经</button>
        <button data-tab="style">文风</button>
      </nav>
      <section class="tab-page active" id="tab-chapters">
        <div id="chapterList" class="chapter-list"></div>
        <button class="wide ghost" id="addChapterBtn">＋ 新建章节</button>
        <button class="wide subtle-danger" id="deleteChapterBtn">删除当前章节</button>
      </section>
      <section class="tab-page" id="tab-story">
        <button class="wide director-launch" id="fullBookDirectorBtn">✦ 一键创作全文 · 从灵感到完稿</button>
        <p class="muted compact-help">无人值守依次完成开书、全书规划、分卷拆章、逐章正文、审计修订和故事记忆回灌；可随时暂停并从检查点继续。</p>
        <button class="wide planning-launch" id="incubatorBtn">✦ 灵感孵化 · AI 自动导演开书</button>
        <p class="muted compact-help">只给一句灵感也可以。AI 会扩展为两套作品定位、人物、世界规则和完整大纲，采用后可继续自动生成全书规划。</p>
        <div class="form-grid compact-grid">
          <label>作品形态<select id="storyMode"><option value="long">长篇/连载</option><option value="short">短篇/中短篇</option></select></label>
          <label>计划章节数<input id="targetChapters" type="number" min="1" max="2000" value="30"></label>
        </div>
        <label>核心构想<textarea id="premiseInput" rows="4" placeholder="一句话梗概、主题与核心冲突"></textarea></label>
        <label>全书大纲<textarea id="outlineInput" rows="8" placeholder="主线、阶段目标、结局方向"></textarea></label>
        <label>长期作者意图<textarea id="authorIntent" rows="4" placeholder="这本书最终想成为什么；不可因单章灵感轻易改变"></textarea></label>
        <label>近期焦点<textarea id="currentFocus" rows="3" placeholder="未来 1–3 章应推进的矛盾、人物或伏笔"></textarea></label>
        <label>本书硬规则<textarea id="bookRules" rows="4" placeholder="角色底线、力量上限、叙事禁令、不可修改的设定"></textarea></label>
        <label>核心问题<textarea id="centralQuestion" rows="2" placeholder="故事最终要回答的价值或人物问题"></textarea></label>
        <label>当前故事弧<input id="currentArc" placeholder="例如：白塔调查篇 / 关系破裂阶段"></label>
        <label>结局方向<textarea id="endingDirection" rows="2" placeholder="只写收束方向和代价，不必写死细节"></textarea></label>
        <div class="form-grid compact-grid">
          <label>叙事视角<select id="narrativePov"><option value="auto">从原文识别</option><option value="first">第一人称</option><option value="third_limited">第三人称限知</option><option value="omniscient">全知视角</option></select></label>
          <label>时态<select id="narrativeTense"><option value="auto">从原文识别</option><option value="past">过去/叙事时</option><option value="present">现在时</option></select></label>
        </div>
        <label>总体气质<input id="narrativeTone" placeholder="冷峻、轻盈、压抑、黑色幽默……"></label>
        <button class="wide" id="bookIdeasBtn">✦ AI 推荐主题与核心冲突</button>
        <button class="wide planning-launch" id="planningBtn">✦ AI 分层规划 <span id="planningCount">尚未规划</span></button>
        <button class="wide ghost" id="charactersBtn">人物卡 <span id="characterCount">0</span></button>
        <button class="wide ghost" id="fanficBtn">同人正典锁 <span id="fanficCount">0</span></button>
        <button class="wide ghost" id="referencesBtn">参考资料库 <span id="referenceCount">0</span></button>
        <button class="wide ghost" id="worldBtn">世界书 <span id="worldCount">0</span></button>
        <button class="wide ghost" id="knowledgeBtn">知识图谱 <span id="knowledgeCount">0</span></button>
        <button class="wide ghost" id="memoryBtn">故事记忆 <span id="memoryCount">0</span></button>
        <button class="wide ghost" id="skillsBtn">写作 Skills <span id="skillCount">0</span></button>
        <button class="wide ghost" id="versionsBtn">历史版本</button>
      </section>
      <section class="tab-page" id="tab-style">
        <label>临时样文<textarea id="styleSample" rows="8" placeholder="可直接粘贴样文；更推荐用“参考资料库”上传多篇 TXT/MD/DOCX/EPUB/PDF"></textarea></label>
        <button class="wide ghost" id="styleFilesBtn">＋ 上传/管理多篇文风样文</button>
        <button class="wide" id="analyzeStyleBtn">分析并学习文风</button>
        <label>文风卡<textarea id="styleProfile" rows="9" placeholder="分析结果会出现在这里，也可以手动修改"></textarea></label>
        <p class="muted compact-help">文风资料只用于提炼句法、节奏、对话与描写密度；系统会额外检查与样文的长句复用，避免把参考原文直接抄进正文。</p>
      </section>
    </aside>

    <section class="editor-panel">
      <div class="chapter-head">
        <input id="chapterTitle" class="chapter-title" value="第一章">
        <span id="wordCount" class="muted">0 字</span>
      </div>
      <input id="sceneGoal" class="scene-goal" placeholder="本章/本场景目标：人物想要什么？冲突如何推进？">
      <input id="chapterSummary" class="chapter-summary" placeholder="本章摘要：写完后用几句话记录关键事件，供后续章节保持记忆">
      <div id="planStrip" class="plan-strip"><span>本章尚未规划</span><button class="ghost" id="showPlanBtn">查看计划</button></div>
      <textarea id="editor" spellcheck="false" placeholder="从这里开始写。选中一段文字后，可以让模型重写或扩写……"></textarea>
      <div class="author-note">
        <span>本章作者注（可留空）</span>
        <input id="authorNote" placeholder="只约束当前章，例如：压低情绪，本章不要揭示凶手">
      </div>
    </section>

    <aside class="ai-panel">
      <div class="ai-title"><div class="spark">✦</div><div><b>创作副驾</b><small id="modelStatus">等待连接本地模型</small></div></div>
      <div class="mode-grid">
        <button class="mode active" data-mode="continue">续写</button>
        <button class="mode" data-mode="instruction">按要求写</button>
        <button class="mode" data-mode="rewrite">重写选中</button>
        <button class="mode" data-mode="expand">扩写选中</button>
      </div>
      <p class="muted compact-help" id="modeHelp">空白新章可直接使用“AI 自动规划并写本章”；已有正文时，“续写”会从最后一句自然接下去。</p>
      <label>这次想怎么写？<textarea id="instruction" rows="6" placeholder="例如：写 800 字。雨夜里，两人第一次坦白，但都隐瞒了最重要的事实。"></textarea></label>
      <div class="inline-field"><label>目标字数<input id="targetWords" type="number" min="100" max="10000" value="1200"></label><button class="ghost" id="planBtn">AI 细化本章</button></div>
      <button class="wide ghost" id="autoChapterBtn" title="若本章尚未细化，AI 会先生成执行计划，再直接写出候选草稿">✦ AI 自动规划并写本章</button>
      <button class="wide ghost" id="ideasBtn" title="当现有章节路线不满意、剧情卡住或想比较其他走向时使用">卡住时：推荐下一步主题与冲突</button>
      <button id="generateBtn" class="generate">✦ 开始创作</button>
      <button id="stopBtn" class="wide danger hidden">停止生成</button>
      <div class="context-card">
        <div><b>本次上下文</b><span id="tokenEstimate">—</span></div>
        <div id="loreBadges" class="badges"><span class="muted">世界书条目会按正文关键词自动激活</span></div>
        <div id="memoryBadges" class="badges"></div>
        <div id="skillBadges" class="badges"></div>
        <div id="budgetWarnings" class="warning-text"></div>
      </div>
      <div class="draft-card">
        <div class="draft-head"><b>生成草稿</b><span id="draftState" class="muted">尚未生成</span></div>
        <div id="draft" class="draft" contenteditable="true"></div>
        <div class="draft-actions hidden" id="draftActions">
          <button class="ghost" id="discardBtn">丢弃</button>
          <button class="ghost" id="auditBtn">连续性审计</button>
          <button class="ghost" id="canonAuditBtn">同人/OOC审校</button>
          <button id="insertBtn">插入正文</button>
          <button id="acceptMemoryBtn">插入并更新记忆</button>
        </div>
      </div>
      <div class="audit-card hidden" id="auditCard"></div>
    </aside>
  </main>

  <dialog id="modal"><form method="dialog"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon" id="modalClose" type="button" aria-label="关闭弹窗">×</button></div><div id="modalBody"></div></form></dialog>
  <div id="toast"></div>
  <script src="/assets/app.js?v=0.20.0"></script>
</body>
</html>
